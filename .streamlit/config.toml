[theme]
base = "light"
primaryColor = "#146C5A"
backgroundColor = "#E4E9E7"
secondaryBackgroundColor = "#D4DEDA"
textColor = "#17221F"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'Archivo':https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&display=swap"
borderColor = "#AABBB4"
dataframeHeaderBackgroundColor = "#C8D5D0"
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#146C5A", "#E76F51", "#168AAD", "#E9C46A", "#6B705C", "#8E6C88"]

[theme.sidebar]
backgroundColor = "#D9E1DE"
secondaryBackgroundColor = "#C8D5D0"
primaryColor = "#146C5A"
borderColor = "#AABBB4"
